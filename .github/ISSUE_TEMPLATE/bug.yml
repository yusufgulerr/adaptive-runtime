name: Bug report
description: Report a reproducible defect in the runtime, providers, or package.
title: "[bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets, tokens, customer data,
        or unredacted production logs. For security vulnerabilities, follow
        SECURITY.md instead of opening a public issue.
  - type: input
    id: version
    attributes:
      label: Package version or commit
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "v24.15.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, Ubuntu 24.04, macOS 15"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the actual behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include code, policy, providers, and steps. Keep it as small as possible.
      render: ts
    validations:
      required: true
  - type: textarea
    id: metadata
    attributes:
      label: Decision metadata and logs
      description: Redact secrets and personal data. Include error name, code, message, and cause.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I removed secrets, tokens, and personal data from this report.
          required: true
