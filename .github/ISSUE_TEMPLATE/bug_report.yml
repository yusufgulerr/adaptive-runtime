name: Bug report
description: Report a reproducible defect in the runtime, providers, or package.
title: "[bug]: "
labels: ["bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets, tokens, customer data,
        or unredacted production logs. For security vulnerabilities, follow
        SECURITY.md instead of opening a public issue.
  - type: input
    id: version
    attributes:
      label: Package version or commit
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "v24.15.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, Ubuntu 24.04, macOS 15"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Policy and selection
        - Signals and providers
        - Lifecycle, timeout, or abort
        - Observability and events
        - Packaging and releases
        - Documentation and examples
        - Other
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened? Include the exact error name, code, and message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect instead, and why?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that start from a clean checkout or install.
      placeholder: |
        1. Install ...
        2. Configure ...
        3. Run ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest policy, provider, and strategy code that triggers the issue.
      render: ts
    validations:
      required: true
  - type: textarea
    id: metadata
    attributes:
      label: Decision metadata and logs
      description: Redact secrets and personal data. Include reason codes, budgets, and signal statuses.
      render: text
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Related issues, recent changes, workarounds, or environment details.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I removed secrets, tokens, and personal data from this report.
          required: true
