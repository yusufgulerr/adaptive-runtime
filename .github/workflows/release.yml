name: Release

# Tag-driven only. Publishing is an irreversible external side effect and must be
# approved through the protected "release" environment before this job runs.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm and create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: Full verification
        run: npm run check
      - name: Coverage gate
        run: npm run test:coverage
      - name: Inspect package contents
        run: npm pack --dry-run
      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          package_version="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('package.json', 'utf8')).version)")"
          if [ "${GITHUB_REF_NAME}" != "v${package_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${package_version}" >&2
            exit 1
          fi
      - name: Detect npm credentials
        id: npm-auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN}" ]; then
            echo "mode=token" >> "${GITHUB_OUTPUT}"
          else
            echo "mode=oidc" >> "${GITHUB_OUTPUT}"
          fi
      # setup-node's registry-url writes an empty _authToken line that prevents
      # npm from starting the OIDC exchange, so the fallback configures npm only
      # when a token is actually present.
      - name: Configure npm token fallback
        if: steps.npm-auth.outputs.mode == 'token'
        run: |
          set -euo pipefail
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "${RUNNER_TEMP}/.npmrc"
          echo "NPM_CONFIG_USERCONFIG=${RUNNER_TEMP}/.npmrc" >> "${GITHUB_ENV}"
      - name: Publish with provenance (OIDC trusted publishing)
        if: steps.npm-auth.outputs.mode == 'oidc'
        run: npm publish --provenance --access public
      - name: Publish with provenance (token fallback)
        if: steps.npm-auth.outputs.mode == 'token'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  verify-publish:
    name: Verify published package
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Wait for registry propagation
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 30); do
            published="$(npm view "adaptive-runtime@${version}" version 2>/dev/null || true)"
            if [ "${published}" = "${version}" ]; then
              echo "Registry serves adaptive-runtime@${version} after ${attempt} attempt(s)."
              exit 0
            fi
            echo "Attempt ${attempt}/30: registry has not served adaptive-runtime@${version} yet."
            sleep 10
          done
          echo "Registry did not serve adaptive-runtime@${version} within 5 minutes." >&2
          exit 1
      - name: Check registry metadata and integrity
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          metadata="$(npm view "adaptive-runtime@${version}" --json)"
          METADATA="${metadata}" VERSION="${version}" node --input-type=module -e "
          const metadata = JSON.parse(process.env.METADATA);
          const expected = process.env.VERSION;
          if (metadata.version !== expected) throw new Error('version mismatch: ' + metadata.version);
          if (!metadata.dist || typeof metadata.dist.integrity !== 'string' || !metadata.dist.integrity.startsWith('sha512-')) {
            throw new Error('missing sha512 dist.integrity');
          }
          if (metadata.repository?.url !== 'git+https://github.com/yusufgulerr/adaptive-runtime.git') {
            throw new Error('unexpected repository.url: ' + metadata.repository?.url);
          }
          console.log('registry metadata OK; integrity=' + metadata.dist.integrity);
          "
      - name: Install and import from a clean consumer
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          consumer="${RUNNER_TEMP}/adaptive-runtime-consumer"
          mkdir -p "${consumer}"
          cd "${consumer}"
          npm init -y >/dev/null
          npm install "adaptive-runtime@${version}"
          node --input-type=module -e "
          import { createAdaptiveRuntime, ProcessMemoryProvider } from 'adaptive-runtime';
          import { definePolicy, resolvePolicy } from 'adaptive-runtime/policy';
          import { EventLoopDelayProvider } from 'adaptive-runtime/providers';
          const policy = definePolicy({ evaluationIntervalMs: 0 });
          if (resolvePolicy(policy).evaluationIntervalMs !== 0) throw new Error('policy subpath mismatch');
          const runtime = createAdaptiveRuntime({
            providers: [new ProcessMemoryProvider(), new EventLoopDelayProvider()],
            policy,
          });
          const result = await runtime.run({
            operationId: 'post-publish-smoke',
            input: 10,
            strategies: [{ id: 'sum', qualityTier: 1, run: ({ input }) => input + 1 }],
          });
          if (result.value !== 11) throw new Error('unexpected strategy result');
          if (result.metadata.strategyId !== 'sum') throw new Error('unexpected strategy id');
          await runtime.close();
          console.log('clean consumer import, run, subpaths, and close OK');
          "
      - name: Verify provenance attestation
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          npm view "adaptive-runtime@${version}" dist.attestations --json > "${RUNNER_TEMP}/attestations.json"
          node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          const parsed = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/attestations.json', 'utf8'));
          const attestations = Array.isArray(parsed) ? parsed[0] : parsed;
          if (!attestations || typeof attestations.url !== 'string' || attestations.url.length === 0) {
            throw new Error('missing provenance attestation');
          }
          console.log('provenance attestation present: ' + attestations.url);
          "
