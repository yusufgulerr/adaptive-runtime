name: Release

# Tag-driven only. Publishing is an irreversible external side effect and must be
# approved through the protected "release" environment before this job runs.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm and create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: Full verification
        run: npm run check
      - name: Coverage gate
        run: npm run test:coverage
      - name: Inspect package contents
        run: npm pack --dry-run
      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${package_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${package_version}" >&2
            exit 1
          fi
      - name: Detect npm credentials
        id: npm-auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN}" ]; then
            echo "mode=token" >> "${GITHUB_OUTPUT}"
          else
            echo "mode=oidc" >> "${GITHUB_OUTPUT}"
          fi
      # setup-node's registry-url writes an empty _authToken line that prevents
      # npm from starting the OIDC exchange, so the fallback configures npm only
      # when a token is actually present.
      - name: Configure npm token fallback
        if: steps.npm-auth.outputs.mode == 'token'
        run: |
          set -euo pipefail
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "${RUNNER_TEMP}/.npmrc"
          echo "NPM_CONFIG_USERCONFIG=${RUNNER_TEMP}/.npmrc" >> "${GITHUB_ENV}"
      - name: Publish with provenance (OIDC trusted publishing)
        if: steps.npm-auth.outputs.mode == 'oidc'
        run: npm publish --provenance --access public
      - name: Publish with provenance (token fallback)
        if: steps.npm-auth.outputs.mode == 'token'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
