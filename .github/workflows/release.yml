name: Release

# Tag pushes verify the release and create a GitHub release. npm publication is a
# separate, manually dispatched step so the GitHub release can exist before the
# registry account is ready. Publish later with:
#   gh workflow run release.yml --ref v0.3.0 -f publish_npm=true
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "Publish the selected tag to npm"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: Full verification
        run: npm run check
      - name: Coverage gate
        run: npm run test:coverage
      - name: Inspect package contents
        run: npm pack --dry-run
      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          package_version="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('package.json', 'utf8')).version)")"
          if [ "${GITHUB_REF_NAME}" != "v${package_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${package_version}" >&2
            exit 1
          fi

  github-release:
    name: Create GitHub release
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub release ${GITHUB_REF_NAME} already exists."
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
          fi

  publish-npm:
    name: Publish to npm
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.publish_npm == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          package_version="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('package.json', 'utf8')).version)")"
          if [ "${GITHUB_REF_NAME}" != "v${package_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${package_version}" >&2
            exit 1
          fi
      # setup-node's registry-url writes an empty _authToken line that prevents
      # npm from starting the OIDC exchange, so the fallback configures npm only
      # when a token is actually present.
      - name: Detect npm credentials
        id: npm-auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN}" ]; then
            echo "mode=token" >> "${GITHUB_OUTPUT}"
          else
            echo "mode=oidc" >> "${GITHUB_OUTPUT}"
          fi
      - name: Configure npm token fallback
        if: steps.npm-auth.outputs.mode == 'token'
        run: |
          set -euo pipefail
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "${RUNNER_TEMP}/.npmrc"
          echo "NPM_CONFIG_USERCONFIG=${RUNNER_TEMP}/.npmrc" >> "${GITHUB_ENV}"
      - name: Publish with provenance (OIDC trusted publishing)
        if: steps.npm-auth.outputs.mode == 'oidc'
        run: npm publish --provenance --access public
      - name: Publish with provenance (token fallback)
        if: steps.npm-auth.outputs.mode == 'token'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  verify-publish:
    name: Verify published package
    needs: publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify published package
        run: node scripts/verify-published-package.mjs --version "${GITHUB_REF_NAME#v}"
